name: Build for cPanel

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to cpanel-deployment branch
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git fetch origin
          git checkout cpanel-deployment 2>/dev/null || git checkout -b cpanel-deployment
          git merge origin/main --allow-unrelated-histories -X theirs -m "Merge latest changes from main"
          git add production_build/ -f
          git commit -m "Automated build for Namecheap cPanel" || echo "No new changes"
          git push origin cpanel-deployment
